name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sungrid
          POSTGRES_PASSWORD: sungrid_ci
          POSTGRES_DB: sungrid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sungrid -d sungrid_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

      DATABASE_URL: postgresql://sungrid:sungrid_ci@localhost:5432/sungrid_ci

      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Create CI database schema
        run: npx prisma db push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sungrid
          POSTGRES_PASSWORD: sungrid_ci
          POSTGRES_DB: sungrid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sungrid -d sungrid_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

      DATABASE_URL: postgresql://sungrid:sungrid_ci@localhost:5432/sungrid_ci

      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Create CI database schema
        run: npx prisma db push

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore